# Direct configuration parameters native to stefanprodan/podinfo
replicaCount: 1

# Explicitly leave out command blocks so the container runs its native entrypoint
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.7.0
  pullPolicy: IfNotPresent

# Override the application configuration directly
ui:
  color: "#34577c"
  message: "Hello from DevOps Upskilling!"

service:
  type: ClusterIP
  externalPort: 9898
  internalPort: 9898

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi