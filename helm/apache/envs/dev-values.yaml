# Add this to the top of helm/apache/envs/dev-values.yaml
image:
  registry: docker.io
  repository: bitnami/apache
  tag: latest # Overrides the broken chart default with the stable latest tag

replicaCount: 1

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi