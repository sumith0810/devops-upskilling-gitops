# Overriding the upstream chart's container details to point to an explicit image mirror
image:
  registry: public.ecr.aws
  repository: nginx/nginx
  tag: alpine

replicaCount: 1

service:
  type: ClusterIP
  port: 80

# This matches the parameters inside the Bitnami deployment chart template
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi