# Using the standard Docker Official Image Mirror for Apache on AWS ECR Public
image:
  registry: public.ecr.aws
  repository: docker/library/httpd
  tag: alpine

replicaCount: 1

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi