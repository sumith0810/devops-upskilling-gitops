apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-helm-apache
  namespace: argocd
  annotations:
    argocd.argoproj.io/kustomize-build-options: --enable-helm
spec:
  project: default
  source:
    repoURL: 'https://github.com/sumith0810/devops-upskilling-gitops.git'
    targetRevision: HEAD
    path: apps/podinfo/envs/dev # Pure Kustomize tracking path
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: upskilling-helm-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.strategy.rollingUpdate.maxSurge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true